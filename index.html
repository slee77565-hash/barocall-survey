<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>택시 호출 앱 이용 경험 설문조사</title>
<meta name="description" content="모빌리티 플랫폼 요금 안내에 대한 소비자 인식 연구">
<style>
:root{
  --canvas:#f4f5f8; --card:#ffffff;
  --ink:#12151b; --ink-2:#3f4653; --ink-3:#767f8c;
  --line:#e6e9ee; --line-2:#cfd5de; --field:#f8f9fb;
  --brand:#4338ca; --brand-2:#7c3aed; --brand-soft:#eef0fe;
  --stim:#f7c948; --stim-ink:#1b1a13; --warn:#c02626; --r:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--canvas); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  font-size:16px; line-height:1.65; letter-spacing:-0.011em; -webkit-font-smoothing:antialiased}
.wrap{width:min(40rem, 100% - 1.75rem); margin-inline:auto}

#bar{position:sticky; top:0; z-index:20; background:rgba(244,245,248,.9); backdrop-filter:saturate(1.8) blur(10px)}
#bar .wrap{display:flex; align-items:center; gap:.85rem; height:54px}
#back{border:0; background:none; cursor:pointer; font:inherit; font-size:.82rem; color:var(--ink-3); padding:.3rem .1rem; white-space:nowrap}
#back[hidden]{display:none}
#track{flex:1; height:4px; background:#e2e5ec; border-radius:3px; overflow:hidden}
#fill{height:100%; width:0; border-radius:3px; background:linear-gradient(90deg,var(--brand),var(--brand-2)); transition:width .5s cubic-bezier(.2,.8,.2,1)}
#pct{font-size:.74rem; color:var(--ink-3); font-variant-numeric:tabular-nums; min-width:2.9em; text-align:right}
#bar.hide{opacity:0; pointer-events:none}

main{padding:.6rem 0 4rem}
.card{background:var(--card); border-radius:var(--r); padding:1.9rem 1.6rem;
  box-shadow:0 1px 2px rgba(18,21,27,.04), 0 10px 30px -22px rgba(18,21,27,.5);
  animation:enter .42s cubic-bezier(.2,.8,.25,1) both}
@keyframes enter{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}

.eyebrow{font-size:.7rem; font-weight:700; letter-spacing:.15em; color:var(--brand); margin:0 0 .5rem; text-transform:uppercase}
h1{font-size:1.4rem; line-height:1.4; font-weight:800; margin:0 0 1.15rem; letter-spacing:-0.028em}
h2{font-size:.95rem; font-weight:700; margin:2rem 0 .7rem; letter-spacing:-0.02em; color:var(--ink)}
p{margin:0 0 .95rem; color:var(--ink-2)}
p.lead{color:var(--ink)}
.fine{font-size:.85rem; color:var(--ink-3)}
.rule{border:0; border-top:1px solid var(--line); margin:1.5rem 0}

.byline{margin:0 0 1.4rem; padding:.9rem 1rem; background:var(--brand-soft); border-radius:10px; font-size:.9rem; color:var(--ink); line-height:1.7}
.byline span{display:block}
.factlist{margin:0 0 1.3rem; padding:0; list-style:none; border-top:1px solid var(--line)}
.factlist li{display:flex; gap:.9rem; padding:.7rem 0; border-bottom:1px solid var(--line); font-size:.92rem}
.factlist b{flex:none; width:5.2rem; color:var(--ink-3); font-size:.86rem; font-weight:500}
.factlist i{font-style:normal; color:var(--ink-2)}
.agree{display:flex; gap:.7rem; align-items:flex-start; padding:.95rem 1rem; margin-top:.3rem;
  border:1px solid var(--line-2); border-radius:10px; cursor:pointer; background:var(--field);
  font-size:.95rem; color:var(--ink); transition:border-color .15s, background-color .15s}
.agree.on{border-color:var(--brand); background:var(--brand-soft)}
.agree input{margin:.32rem 0 0; accent-color:var(--brand); flex:none; width:1rem; height:1rem}

.q{padding:1.3rem 0; border-top:1px solid var(--line)}
.q:first-of-type{border-top:0; padding-top:.4rem}
.stem{display:flex; gap:.7rem; margin-bottom:.9rem}
.code{display:none; flex:none; font-size:.66rem; font-weight:700; color:var(--brand); padding-top:.36rem; letter-spacing:.05em}
body.review .code{display:block}
.text{font-size:1rem; line-height:1.55; color:var(--ink)}

.scale{display:grid; grid-template-columns:repeat(7,1fr); gap:.32rem}
.scale label{display:flex; align-items:center; justify-content:center; min-height:48px; cursor:pointer;
  border:1px solid var(--line); border-radius:10px; background-color:var(--field);
  font-size:.9rem; color:var(--ink-2); font-variant-numeric:tabular-nums;
  transition:background-color .15s, border-color .15s, transform .1s}
.scale label:active{transform:scale(.96)}
.scale input{position:absolute; opacity:0; width:0; height:0}
.scale label:has(input:checked){background-color:var(--brand); border-color:var(--brand); font-weight:700}
.scale label:has(input:checked) span{color:#fff}
.scale label:focus-within{outline:2px solid var(--brand-2); outline-offset:2px}
.anchors{display:flex; justify-content:space-between; margin-top:.5rem; font-size:.74rem; color:var(--ink-3)}

.choices{display:flex; flex-direction:column; gap:.45rem}
.choices label{display:flex; align-items:flex-start; gap:.65rem; padding:.8rem .9rem; cursor:pointer;
  border:1px solid var(--line); border-radius:10px; background-color:var(--field);
  font-size:.95rem; color:var(--ink-2); transition:background-color .15s, border-color .15s}
.choices label:has(input:checked){background-color:var(--brand-soft); border-color:var(--brand); font-weight:600}
.choices label:has(input:checked) span{color:var(--ink)}
.choices label:focus-within{outline:2px solid var(--brand-2); outline-offset:2px}
.choices input{margin:.36rem 0 0; accent-color:var(--brand); flex:none}

input[type=number], select, textarea{width:100%; padding:.75rem .9rem; font:inherit; font-size:.95rem;
  color:var(--ink); background:var(--field); border:1px solid var(--line); border-radius:10px}
textarea{min-height:5.5rem; resize:vertical; line-height:1.6}
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible{outline:2px solid var(--brand-2); outline-offset:2px}

.actions{margin-top:2.2rem; display:flex; flex-direction:column; gap:.7rem}
button.go{width:100%; padding:1rem; font:inherit; font-weight:700; font-size:1rem; color:#fff;
  border:0; border-radius:12px; cursor:pointer; letter-spacing:-0.01em;
  background:linear-gradient(92deg,var(--brand),var(--brand-2));
  box-shadow:0 8px 20px -12px rgba(67,56,202,.9); transition:opacity .15s, transform .1s}
button.go:active{transform:scale(.99)}
button.go:disabled{background:#c9ccd4; box-shadow:none; cursor:not-allowed}
button.ghost{width:100%; padding:.72rem 1rem; font:inherit; font-size:.88rem; font-weight:600; color:var(--ink-2);
  background:var(--card); border:1px solid var(--line-2); border-radius:12px; cursor:pointer}
button.ghost[hidden]{display:none}
.hint{font-size:.83rem; color:var(--ink-3); text-align:center; min-height:1.2em}
.hint.err{color:var(--warn); font-weight:600}

.rv{display:none}
.rv.in{display:block; animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0; transform:translateY(9px)} to{opacity:1; transform:none}}
.script p{color:var(--ink); font-size:1rem; line-height:1.8}
.phone{margin:1.5rem 0 .3rem; border:1px solid var(--line-2); border-radius:18px; overflow:hidden;
  background:#fff; box-shadow:0 14px 34px -20px rgba(18,21,27,.55)}
.phone .top{display:flex; align-items:center; justify-content:space-between; padding:.85rem 1.05rem; border-bottom:1px solid var(--line)}
.brand{font-weight:800; font-size:1rem; letter-spacing:-0.03em}
.brand em{font-style:normal; background:var(--stim); color:var(--stim-ink); padding:.12rem .42rem; border-radius:6px; margin-right:.3rem}
.phone .tag{font-size:.74rem; color:var(--ink-3)}
.phone .body{padding:1.35rem 1.05rem 1.05rem}
.fareRow{display:flex; align-items:baseline; justify-content:space-between; gap:1rem}
.fareLabel{font-size:.86rem; color:var(--ink-3)}
.fare{font-size:2rem; font-weight:800; letter-spacing:-0.045em; font-variant-numeric:tabular-nums}
.prev{margin-top:.25rem; font-size:.84rem; color:var(--ink-3); font-variant-numeric:tabular-nums}
.notice{margin-top:1.1rem; padding:.9rem 1rem; background:#fffaeb; border:1px solid #f5e3ad;
  border-left:3px solid var(--stim); border-radius:9px; font-size:.93rem; line-height:1.6; color:var(--ink)}
.callBtn{margin-top:1.1rem; padding:.9rem; text-align:center; font-weight:800; background:var(--stim); color:var(--stim-ink); border-radius:11px}
.player{display:flex; align-items:center; gap:.7rem; margin-top:1.3rem}
.pline{flex:1; height:3px; background:var(--line); border-radius:3px; overflow:hidden}
.pline i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--brand),var(--brand-2)); transition:width .12s linear}
.ptext{font-size:.76rem; color:var(--ink-3); white-space:nowrap}

.center{text-align:center; padding:2.4rem 0 1rem}
.spin{width:34px; height:34px; margin:0 auto 1.2rem; border:3px solid var(--line); border-top-color:var(--brand); border-radius:50%; animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.done{width:46px; height:46px; margin:0 auto 1.2rem; border-radius:50%;
  background:linear-gradient(135deg,var(--brand),var(--brand-2)); display:flex; align-items:center; justify-content:center; color:#fff; font-size:1.35rem}

#rvToggle{position:fixed; right:.85rem; bottom:.85rem; z-index:31; border:0; cursor:pointer; background:var(--ink); color:#fff;
  border-radius:999px; padding:.55rem .9rem; font:inherit; font-size:.75rem; font-weight:700; box-shadow:0 10px 26px -14px rgba(0,0,0,.8)}
#review{position:fixed; right:.85rem; bottom:3.5rem; z-index:30; background:var(--ink); color:#fff; border-radius:12px;
  padding:.75rem .85rem; width:14.5rem; font-size:.78rem; box-shadow:0 14px 34px -14px rgba(0,0,0,.8)}
#review[hidden]{display:none}
#review b{display:block; font-size:.65rem; letter-spacing:.12em; opacity:.55; margin-bottom:.45rem}
#review select{background:#232a36; color:#fff; border-color:#39424f; padding:.42rem .5rem; font-size:.8rem; margin-bottom:.4rem}
#review button{width:100%; font:inherit; font-size:.78rem; font-weight:600; padding:.45rem; border:0; border-radius:8px; background:#39424f; color:#fff; cursor:pointer}
body.review main{padding-bottom:7rem}

footer{padding:1.6rem 0 3rem; text-align:center; font-size:.72rem; color:var(--line-2)}
@media (max-width:23.5rem){ .card{padding:1.5rem 1.15rem} .scale{gap:.22rem} .scale label{font-size:.82rem} }
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }
</style>
</head>
<body>

<div id="bar" class="hide"><div class="wrap">
  <button id="back" type="button" hidden>← 이전</button>
  <div id="track"><div id="fill"></div></div>
  <div id="pct">0%</div>
</div></div>

<main><div class="wrap"><div id="app"></div></div></main>
<footer>국민대학교 비즈니스IT전문대학원</footer>

<script>
"use strict";

/* ═══ 설정: 응답 수신 주소를 여기에 넣으세요 ═══ */
const CONFIG = {
  ENDPOINT: "https://script.google.com/macros/s/AKfycbybe34UkuVyPaeufCHrIxVGVgvTyuaLmiiDOPVhhKFrRTzOn8GkHXZdHCTIYOWtBTH4/exec",
  RESEARCH_EMAIL: "b831028@naver.com",
  FEEDBACK: true,                     // 설문 참여 소감(파일럿용). 본조사에서는 false
  FARE_NOW: "3,600원",
  FARE_BEFORE: "3,000원"
};

const AGENTS = { ai:{label:"AI 요금 알고리즘"}, human:{label:"바로콜 요금정책 담당자"} };
const BASES = { market:{phrase:"현재 지역의 호출 수요와 배차 가능 차량 수"},
                data:{phrase:"고객님의 최근 이용 빈도, 주 이용 시간대, 호출 옵션 선택 이력"} };
const params = new URLSearchParams(location.search);
const REVIEW = params.get("review")==="1";
const pick = a => a[Math.floor(Math.random()*a.length)];
const COND = {
  agent: AGENTS[params.get("agent")] ? params.get("agent") : pick(["ai","human"]),
  basis: BASES[params.get("basis")] ? params.get("basis") : pick(["market","data"])
};
const A = () => AGENTS[COND.agent], B = () => BASES[COND.basis];
function josa(w,a,b){ const c=w.charCodeAt(w.length-1);
  const has=(c>=0xAC00&&c<=0xD7A3)?((c-0xAC00)%28!==0):true; return has?a:b; }
const noticeText = () => { const who=A().label, what=B().phrase;
  return `${who}${josa(who,"이","가")} ${what}${josa(what,"을","를")} 바탕으로 호출 이용료를 결정했습니다.`; };

const lk = (code,text) => ({code,text});
const G = {
  DF:[lk("DF1","오늘 제시된 호출 이용료는 공정하다."),
      lk("DF2","오늘 제시된 호출 이용료는 합리적이다."),
      lk("DF3","오늘 제시된 호출 이용료는 적정하다.")],
  PF:[lk("PF1","이 호출 이용료가 정해진 과정은 공정하다."),
      lk("PF2","이 호출 이용료를 정한 방식은 타당하다."),
      lk("PF3","바로콜이 이 호출 이용료를 정한 절차는 적절하다.")],
  AC:[lk("AC1","나는 이 호출 이용료를 지불하고 우선배차로 택시를 부를 의향이 있다."),
      lk("AC2","이 조건이라면 나는 호출하기 버튼을 누를 가능성이 높다."),
      lk("AC3","나는 이 호출 이용료를 지불할 만하다고 생각한다.")],
  SI:[lk("SI1","이 요금을 결정할 때 자기 이익을 우선하려는 의도가 있었다."),
      lk("SI2","이 요금을 결정할 때 욕심을 부렸다."),
      lk("SI3","이 요금 결정에는 나쁜 의도가 있었다.")],
  JD:[lk("JD1","이 요금이 정해지는 과정에서 나는 평가받고 있다는 느낌을 받았다."),
      lk("JD2","이 요금에는 나에 대한 평가나 판단이 반영된 것처럼 느껴졌다."),
      lk("JD3","이 요금을 결정한 쪽이 나를 판단한 것처럼 느껴졌다.")],
  UN:[lk("UN1","이 요금을 정할 때 나의 개별적인 사정이 충분히 고려되지 않았다."),
      lk("UN2","이 요금 결정 방식은 나에게만 해당되는 구체적인 사정을 충분히 고려하지 못했다."),
      lk("UN3","이 요금은 나의 이용 기록만으로는 알 수 없는 개인적인 상황을 충분히 반영하지 못했다.")],
  EX:[lk("EX1","이 요금 결정은 나에게서 더 많은 이익을 얻어내려는 것으로 느껴진다."),
      lk("EX2","이 요금 결정은 이용자를 이용하려는 성격이 있다고 느껴진다."),
      lk("EX3","이 요금 결정은 이용자에게 불리하게 설계되어 있다고 느껴진다.")],
  PR:[lk("PR1","바로콜이 나에 관한 정보를 어떻게 수집하고 있는지 걱정된다."),
      lk("PR2","바로콜이 내 정보를 어떤 목적으로 사용하는지 우려된다."),
      lk("PR3","내 정보가 어떻게 활용되는지 내가 통제하기 어렵다고 느낀다.")],
  SR:[lk("SR1","이 요금은 나의 개인적인 특성이나 행동을 반영하여 정해진 것처럼 느껴졌다."),
      lk("SR2","이 요금은 나에 관한 정보에 근거해 정해진 것으로 보인다."),
      lk("SR3","이 요금은 나와는 무관한 외부 상황 때문에 정해진 것으로 보인다.")],
  RE:[lk("RE1","앞에서 읽은 상황은 실제로 일어날 법하다."),
      lk("RE2","앞에서 읽은 상황은 현실적이다."),
      lk("RE3","앞에서 읽은 상황에 몰입할 수 있었다.")],
  AN:[lk("AN1","이 요금을 결정한 AI 요금 알고리즘은 사람과 비슷한 면이 있다."),
      lk("AN2","이 요금을 결정한 AI 요금 알고리즘은 스스로 생각하는 것처럼 느껴진다.")],
  GP:[lk("GP1","평소 온라인 서비스가 내 개인정보를 수집하는 것에 대해 걱정하는 편이다."),
      lk("GP2","앱을 설치할 때 개인정보 관련 항목을 꼼꼼히 확인하는 편이다."),
      lk("GP3","기업이 내 정보를 어떻게 사용하는지에 대해 민감한 편이다.")]
};

const R = { meta:{ startedAt:new Date().toISOString(), agent:COND.agent, basis:COND.basis,
                   ua:navigator.userAgent, review:REVIEW }, answers:{}, timing:{} };
let step = 0, enteredAt = Date.now();
const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=(Math.random()*(i+1))|0; [b[i],b[j]]=[b[j],b[i]];} return b; };
const MED = shuffle(["SI","JD","UN"]);
R.meta.mediatorOrder = MED;

/* ═══ 렌더 도우미 ═══ */
function one(code,text,lo,hi){
  lo=lo||"전혀 그렇지 않다"; hi=hi||"매우 그렇다";
  const cur=R.answers[code];
  const cells=[1,2,3,4,5,6,7].map(n=>`<label data-code="${code}" data-val="${n}">
    <input type="radio" name="${code}" value="${n}"${cur==n?" checked":""}><span>${n}</span></label>`).join("");
  return `<div class="q" data-req="${code}"><div class="stem"><div class="code">${code}</div><div class="text">${text}</div></div>
    <div class="scale" role="radiogroup" aria-label="${text}">${cells}</div>
    <div class="anchors"><span>1. ${lo}</span><span>7. ${hi}</span></div></div>`;
}
const items = list => list.map(it=>one(it.code,it.text)).join("");
function choices(code,text,opts){
  const NUM=["①","②","③","④","⑤"], cur=R.answers[code];
  const rows=opts.map(([v,l],i)=>`<label data-code="${code}" data-val="${v}">
    <input type="radio" name="${code}" value="${v}"${cur===v?" checked":""}><span>${NUM[i]||""} ${l}</span></label>`).join("");
  return `<div class="q" data-req="${code}"><div class="stem"><div class="code">${code}</div><div class="text">${text}</div></div>
    <div class="choices">${rows}</div></div>`;
}
function sel(code,label,opts){
  return `<div class="q"><div class="stem"><div class="code">${code}</div><div class="text">${label}</div></div>
    <select id="in_${code}"><option value="">선택해 주세요</option>
    ${opts.map(v=>`<option${R.answers[code]===v?" selected":""}>${v}</option>`).join("")}</select></div>`;
}

/* ═══ 화면 ═══ */
const P = [];

P.push({ id:"COVER", bare:true, cta:"설문 시작하기",
  render:()=>`
  <p class="eyebrow">참여 안내</p>
  <h1>택시 호출 앱 이용 경험 설문조사</h1>
  <div class="byline">
    <span><b>국민대학교 비즈니스IT전문대학원</b> 박사과정 <b>이승현</b></span>
    <span>지도교수 <b>안현철</b></span>
  </div>
  <p class="lead">안녕하세요. 바쁘신 중에 시간을 내어 주셔서 감사합니다.</p>
  <p>본 설문은 택시 호출 앱에서 요금 안내를 받았을 때 이용자가 그 요금을 어떻게 받아들이는지를 알아보기 위한 학술 연구입니다.</p>

const app=document.getElementById("app"), bar=document.getElementById("bar");
const fill=document.getElementById("fill"), pctEl=document.getElementById("pct"), backBtn=document.getElementById("back");

function refreshGate(){ const page=P[step], btn=document.getElementById("next");
  if(page.gate && btn) btn.disabled = !page.gate(); }

function draw(){
  const page=P[step]; enteredAt=Date.now();
  bar.classList.toggle("hide", !!page.bare);
  backBtn.hidden = !page.back;
  app.innerHTML=`<div class="card">
    ${page.bare?"":`<p class="eyebrow">${page.eyebrow}</p><h1>${page.title}</h1>`}
    ${page.render()}
    <div class="actions">
      <button class="go" id="next"${page.sequence||page.gate?" disabled":""}>${page.last?"제출하기":(page.cta||"다음")}</button>
      ${page.sequence?'<button class="ghost" id="replay" type="button" hidden>다시 보기</button>':""}
      <div class="hint" id="hint"></div>
    </div></div>`;
  window.scrollTo(0,0);
  const p=Math.round(step/P.length*100); fill.style.width=p+"%"; pctEl.textContent=p+"%";
  document.getElementById("next").addEventListener("click",advance);
  if(page.bind) page.bind();
  if(page.sequence){ runSequence();
    document.getElementById("replay").addEventListener("click",()=>{
      R.meta.replays=(R.meta.replays||0)+1; runSequence(); }); }
}

let timers=[];
function runSequence(){
  timers.forEach(clearTimeout); timers=[];
  const nodes=[...app.querySelectorAll(".rv")];
  const btn=document.getElementById("next"), replay=document.getElementById("replay");
  const line=document.getElementById("pl"), text=document.getElementById("pt");
  const GAP=2400, TAIL=2800, total=(nodes.length-1)*GAP+TAIL;
  nodes.forEach(n=>n.classList.remove("in"));
  btn.disabled=true; replay.hidden=true; text.textContent="보여 드리는 중";
  nodes.forEach((n,i)=>timers.push(setTimeout(()=>{ n.classList.add("in");
    if(i>0){ const r=n.getBoundingClientRect();
      if(r.bottom>window.innerHeight-90) n.scrollIntoView({block:"end",behavior:"smooth"}); }
  }, i*GAP)));
  const t0=Date.now();
  const tick=setInterval(()=>{ const el=Date.now()-t0;
    line.style.width=Math.min(100,el/total*100)+"%";
    if(el>=total){ clearInterval(tick); line.style.width="100%";
      text.textContent="확인 완료"; btn.disabled=false; replay.hidden=false; } },100);
  timers.push(tick);
}

app.addEventListener("click",e=>{
  const lab=e.target.closest("label[data-code]"); if(!lab) return;
  R.answers[lab.dataset.code]=isNaN(lab.dataset.val)?lab.dataset.val:Number(lab.dataset.val);
  const h=document.getElementById("hint"); if(h){h.textContent=""; h.classList.remove("err");}
});

backBtn.addEventListener("click",()=>{ if(step>0){ step--; draw(); } });

function advance(){
  const page=P[step], hint=document.getElementById("hint");
  const fail=m=>{ hint.textContent=m; hint.classList.add("err"); };
  if(page.validate){ const m=page.validate(); if(m) return fail(m); }
  const miss=[...app.querySelectorAll("[data-req]")].filter(q=>R.answers[q.dataset.req]===undefined);
  if(miss.length){ miss[0].scrollIntoView({block:"center",behavior:"smooth"});
    return fail(`아직 응답하지 않은 문항이 ${miss.length}개 있습니다.`); }
  R.timing[page.id]=(R.timing[page.id]||0)+(Date.now()-enteredAt);
  if(page.before) page.before();
  if(page.next && page.next()==="SCREEN_OUT") return screenOut();
  if(page.last) return submit();
  step++; draw();
}

  tg.id="rvToggle"; tg.type="button"; tg.textContent="조건 전환";
  tg.addEventListener("click",()=>{ box.hidden=!box.hidden; tg.textContent=box.hidden?"조건 전환":"닫기"; });
  document.body.append(box,tg);
  document.getElementById("rvA").value=COND.agent;
  document.getElementById("rvB").value=COND.basis;
  document.getElementById("rvGo").addEventListener("click",()=>{
    location.search=`?review=1&agent=${document.getElementById("rvA").value}&basis=${document.getElementById("rvB").value}`; });
}

window.onbeforeunload=()=>"";
draw();
</script>
</body>
</html>
