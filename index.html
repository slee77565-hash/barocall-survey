<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>택시 호출 앱 이용 경험 조사</title>
<meta name="description" content="모빌리티 플랫폼 이용 경험에 관한 학술 연구 설문">
<style>
:root{
  --ink:#14181f;
  --ink-2:#414a57;
  --ink-3:#6d7783;
  --paper:#ffffff;
  --field:#f6f7f8;
  --line:#e2e6ea;
  --line-2:#cbd2d9;
  --focus:#1b4dd8;
  --stim:#f5c33b;      /* 자극(앱 화면) 안에서만 쓰는 색 */
  --stim-ink:#1a1a17;
  --warn:#b03030;
  --radius:10px;
  --wrap:min(38rem, 100% - 2.5rem);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background-color:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  font-size:16px; line-height:1.65; letter-spacing:-0.01em;
  -webkit-font-smoothing:antialiased;
}
.wrap{width:var(--wrap); margin-inline:auto}

/* ── 진행 표시 ─────────────────────────── */
#bar{position:sticky; top:0; z-index:20; background:rgba(255,255,255,.94); backdrop-filter:saturate(1.6) blur(8px); border-bottom:1px solid var(--line)}
#bar .wrap{display:flex; align-items:center; gap:.9rem; height:52px}
#track{flex:1; height:3px; background-color:var(--line); border-radius:2px; overflow:hidden}
#fill{height:100%; width:0; background-color:var(--ink); transition:width .45s cubic-bezier(.2,.8,.2,1)}
#pct{font-size:.74rem; color:var(--ink-3); font-variant-numeric:tabular-nums; letter-spacing:.02em; min-width:3.2em; text-align:right}

/* ── 본문 ──────────────────────────────── */
main{padding:2.4rem 0 5rem}
.eyebrow{
  font-size:.7rem; font-weight:700; letter-spacing:.16em; color:var(--ink-3);
  text-transform:uppercase; margin:0 0 .55rem;
}
h1{font-size:1.5rem; line-height:1.35; font-weight:700; margin:0 0 1.1rem; letter-spacing:-0.025em}
h2{font-size:1.05rem; font-weight:700; margin:2.2rem 0 .8rem; letter-spacing:-0.02em}
p{margin:0 0 1rem; color:var(--ink-2)}
p.lead{color:var(--ink)}
.fine{font-size:.85rem; color:var(--ink-3)}
hr{border:0; border-top:1px solid var(--line); margin:2rem 0}

/* ── 문항 ──────────────────────────────── */
.q{padding:1.35rem 0; border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .stem{display:flex; gap:.7rem; margin-bottom:.85rem}
.q .code{
  display:none; flex:none; font-size:.68rem; font-weight:700; color:var(--ink-3);
  letter-spacing:.06em; padding-top:.34rem; font-variant-numeric:tabular-nums;
}
body.review .q .code{display:block}
.q .text{font-size:1rem; line-height:1.55; color:var(--ink)}

/* 리커트 */
.scale{display:grid; grid-template-columns:repeat(7,1fr); gap:.3rem}
.scale label{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.3rem;
  padding:.6rem .1rem; border:1px solid var(--line); border-radius:var(--radius);
  background-color:var(--field); cursor:pointer; font-size:.82rem; color:var(--ink-2);
  font-variant-numeric:tabular-nums; transition:border-color .12s, background .12s, color .12s;
  min-height:46px;
}
.scale input{position:absolute; opacity:0; width:0; height:0}
.scale label:hover{border-color:var(--line-2)}
.scale label.on{background-color:var(--ink); border-color:var(--ink); color:#fff; font-weight:700}
.scale input:focus-visible + span, .scale label:focus-within{outline:2px solid var(--focus); outline-offset:2px}
.anchors{display:flex; justify-content:space-between; margin-top:.45rem; font-size:.74rem; color:var(--ink-3)}

/* 선택형 */
.choices{display:flex; flex-direction:column; gap:.45rem}
.choices label{
  display:flex; align-items:flex-start; gap:.65rem; padding:.75rem .85rem;
  border:1px solid var(--line); border-radius:var(--radius); background-color:var(--field);
  cursor:pointer; font-size:.95rem; color:var(--ink-2); transition:border-color .12s, background .12s;
}
.choices label:hover{border-color:var(--line-2)}
.choices label.on{background:#eef2fb; border-color:var(--focus); color:var(--ink); font-weight:600}
.choices input{margin:.35rem 0 0; accent-color:var(--focus); flex:none}

/* 입력 */
input[type=text], input[type=number], select{
  width:100%; padding:.7rem .85rem; font:inherit; font-size:.95rem; color:var(--ink);
  background-color:var(--field); border:1px solid var(--line); border-radius:var(--radius);
}
input:focus-visible, select:focus-visible, button:focus-visible{outline:2px solid var(--focus); outline-offset:2px}

/* ── 버튼 ──────────────────────────────── */
.actions{margin-top:2.4rem; display:flex; flex-direction:column; gap:.75rem}
button.go{
  width:100%; padding:.95rem 1rem; font:inherit; font-weight:700; font-size:1rem;
  color:#fff; background-color:var(--ink); border:0; border-radius:var(--radius); cursor:pointer;
  letter-spacing:-0.01em; transition:opacity .15s;
}
button.go:disabled{opacity:.32; cursor:not-allowed}
button.go:not(:disabled):hover{opacity:.88}
.hint{font-size:.82rem; color:var(--ink-3); text-align:center; min-height:1.2em}
.hint.err{color:var(--warn); font-weight:600}

/* ── 자극: 앱 화면 ─────────────────────── */
.phone{
  margin:1.6rem 0; border:1px solid var(--line-2); border-radius:20px; overflow:hidden;
  background:#fff; box-shadow:0 1px 2px rgba(20,24,31,.05), 0 12px 32px -18px rgba(20,24,31,.4);
}
.phone .top{
  display:flex; align-items:center; justify-content:space-between;
  padding:.85rem 1.1rem; border-bottom:1px solid var(--line);
}
.phone .brand{font-weight:800; font-size:1rem; letter-spacing:-0.03em}
.phone .brand span{color:var(--stim-ink); background-color:var(--stim); padding:.1rem .4rem; border-radius:5px; margin-right:.35rem}
.phone .tag{font-size:.74rem; color:var(--ink-3); letter-spacing:.02em}
.phone .body{padding:1.4rem 1.1rem 1.1rem}
.fareRow{display:flex; align-items:baseline; justify-content:space-between; gap:1rem}
.fareLabel{font-size:.86rem; color:var(--ink-3)}
.fare{font-size:2rem; font-weight:800; letter-spacing:-0.045em; font-variant-numeric:tabular-nums}
.prev{margin-top:.3rem; font-size:.84rem; color:var(--ink-3); font-variant-numeric:tabular-nums}
.notice{
  margin-top:1.15rem; padding:.9rem 1rem; background-color:var(--field);
  border:1px solid var(--line); border-left:3px solid var(--stim); border-radius:8px;
  font-size:.92rem; line-height:1.6; color:var(--ink);
}
.callBtn{
  margin-top:1.15rem; width:100%; padding:.9rem; text-align:center; font-weight:800;
  background-color:var(--stim); color:var(--stim-ink); border-radius:10px; font-size:1rem; letter-spacing:-0.01em;
}

/* 순차 노출 */
.rv{display:none}
.rv.in{display:block; animation:rise .5s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
.player{display:flex; align-items:center; gap:.7rem; margin-top:1.4rem}
.pline{flex:1; height:2px; background:var(--line); border-radius:2px; overflow:hidden}
.pline i{display:block; height:100%; width:0; background:var(--ink-3); transition:width .12s linear}
.ptext{font-size:.76rem; color:var(--ink-3); font-variant-numeric:tabular-nums; white-space:nowrap}
button.ghost{
  width:100%; padding:.7rem 1rem; font:inherit; font-size:.88rem; font-weight:600;
  color:var(--ink-2); background-color:var(--paper); border:1px solid var(--line-2);
  border-radius:var(--radius); cursor:pointer;
}
button.ghost[hidden]{display:none}
footer{padding:2rem 0 3rem; text-align:center; font-size:.72rem; color:var(--line-2)}
@media (prefers-reduced-motion:reduce){ .rv.in{animation:none} }

/* 시나리오 지문 */
.script{font-size:1rem; line-height:1.8}
.script p{color:var(--ink)}

/* 검토 모드 */
#rvToggle{
  position:fixed; right:.9rem; bottom:.9rem; z-index:31; border:0; cursor:pointer;
  background-color:var(--ink); color:#fff; border-radius:999px; padding:.55rem .9rem;
  font:inherit; font-size:.76rem; font-weight:700; letter-spacing:-0.01em;
  box-shadow:0 8px 24px -12px rgba(0,0,0,.6);
}
#review{
  position:fixed; right:.9rem; bottom:3.6rem; z-index:30; background-color:var(--ink); color:#fff;
  border-radius:12px; padding:.75rem .85rem; font-size:.78rem; line-height:1.5; width:14.5rem;
  box-shadow:0 12px 32px -12px rgba(0,0,0,.6);
}
#review[hidden]{display:none}
#review b{display:block; font-size:.66rem; letter-spacing:.12em; opacity:.55; margin-bottom:.45rem}
#review select{background:#222a35; color:#fff; border-color:#39424f; padding:.42rem .5rem; font-size:.8rem; margin-bottom:.4rem}
#review button{width:100%; font:inherit; font-size:.78rem; font-weight:600; padding:.45rem; border:0; border-radius:7px; background:#39424f; color:#fff; cursor:pointer}
body.review main{padding-bottom:7rem}

.card{background-color:var(--field); border:1px solid var(--line); border-radius:var(--radius); padding:1.1rem 1.2rem; margin:1.2rem 0}
.card p:last-child{margin-bottom:0}
code.out{display:block; white-space:pre-wrap; word-break:break-all; font-size:.72rem; line-height:1.5;
  background:#0f141b; color:#c9d4e0; padding:.9rem; border-radius:8px; max-height:14rem; overflow:auto}

@media (max-width:24rem){
  .scale{gap:.2rem}
  .scale label{font-size:.76rem; padding:.55rem .05rem}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
}
</style>
</head>
<body>

<div id="bar"><div class="wrap">
  <div id="track"><div id="fill"></div></div>
  <div id="pct">0%</div>
</div></div>

<main><div class="wrap" id="app"></div></main>
<footer>국민대학교 비즈니스IT전문대학원</footer>

<script>
"use strict";

/* ─────────────────────────────────────────────
   0. 설정
   ───────────────────────────────────────────── */
const CONFIG = {
  // 응답을 받을 주소. Google Apps Script 웹앱 URL 등을 넣으면 자동 전송됩니다.
  // 비워 두면 마지막 화면에서 JSON 파일로 내려받습니다.
  ENDPOINT: "",
  MIN_DWELL_MS: 15000,   // 시나리오 최소 열람 시간
  FARE_NOW: "3,600원",
  FARE_BEFORE: "3,000원"
};

/* ─────────────────────────────────────────────
   1. 조건 배정
   ───────────────────────────────────────────── */
const AGENTS = {
  ai:    { key:"ai",    label:"AI 요금 알고리즘",      short:"AI 요금 알고리즘" },
  human: { key:"human", label:"바로콜 요금정책 담당자", short:"바로콜 요금정책 담당자" }
};
const BASES = {
  market: { key:"market", phrase:"현재 지역의 호출 수요와 배차 가능 차량 수" },
  data:   { key:"data",   phrase:"고객님의 최근 이용 빈도, 주 이용 시간대, 호출 옵션 선택 이력" }
};

const params = new URLSearchParams(location.search);
const REVIEW = params.get("review") === "1";
if(REVIEW) document.documentElement.addEventListener("DOMContentLoaded",()=>{});

function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
let COND = {
  agent: params.get("agent") || pick(["ai","human"]),
  basis: params.get("basis") || pick(["market","data"])
};
if(!AGENTS[COND.agent]) COND.agent = "ai";
if(!BASES[COND.basis]) COND.basis = "market";

const A = () => AGENTS[COND.agent];
const B = () => BASES[COND.basis];
// 받침 유무에 따라 조사를 선택 (담당자"가" / 알고리즘"이")
function josa(word, withBatchim, withoutBatchim){
  const c = word.charCodeAt(word.length-1);
  const has = (c>=0xAC00 && c<=0xD7A3) ? ((c-0xAC00)%28 !== 0) : true;
  return has ? withBatchim : withoutBatchim;
}
const noticeText = () => {
  const who = A().label;
  const what = B().phrase;
  return `${who}${josa(who,"이","가")} ${what}${josa(what,"을","를")} 바탕으로 호출 이용료를 결정했습니다.`;
};

/* ─────────────────────────────────────────────
   2. 문항
   ───────────────────────────────────────────── */
const L7 = { type:"likert", lo:"전혀 그렇지 않다", hi:"매우 그렇다" };
const lk = (code, text) => ({ code, text, ...L7 });

const G_DF = { id:"DF", items:[
  lk("DF1","오늘 제시된 호출 이용료는 공정하다."),
  lk("DF2","오늘 제시된 호출 이용료는 합리적이다."),
  lk("DF3","오늘 제시된 호출 이용료는 적정하다.")
]};
const G_PF = { id:"PF", items:[
  lk("PF1","이 호출 이용료가 정해진 과정은 공정하다."),
  lk("PF2","이 호출 이용료를 정한 방식은 타당하다."),
  lk("PF3","바로콜이 이 호출 이용료를 정한 절차는 적절하다.")
]};
const G_AC = { id:"AC", items:[
  lk("AC1","나는 이 호출 이용료를 지불하고 우선배차로 택시를 부를 의향이 있다."),
  lk("AC2","이 조건이라면 나는 호출하기 버튼을 누를 가능성이 높다."),
  lk("AC3","나는 이 호출 이용료를 지불할 만하다고 생각한다.")
]};
const G_SI = { id:"SI", lead:()=>`이 호출 이용료를 결정한 <strong>${A().short}</strong>에 대해 어떻게 생각하시는지 응답해 주세요.`, items:[
  lk("SI1","이 요금을 결정할 때 자기 이익을 우선하려는 의도가 있었다."),
  lk("SI2","이 요금을 결정할 때 욕심을 부렸다."),
  lk("SI3","이 요금 결정에는 나쁜 의도가 있었다.")
]};
const G_JD = { id:"JD", items:[
  lk("JD1","이 요금이 정해지는 과정에서 나는 평가받고 있다는 느낌을 받았다."),
  lk("JD2","이 요금에는 나에 대한 평가나 판단이 반영된 것처럼 느껴졌다."),
  lk("JD3","이 요금을 결정한 쪽이 나를 판단한 것처럼 느껴졌다.")
]};
const G_UN = { id:"UN", items:[
  lk("UN1","이 요금을 정할 때 나의 개별적인 사정이 충분히 고려되지 않았다."),
  lk("UN2","이 요금 결정 방식은 나에게만 해당되는 구체적인 사정을 충분히 고려하지 못했다."),
  lk("UN3","이 요금은 나의 이용 기록만으로는 알 수 없는 개인적인 상황을 충분히 반영하지 못했다.")
]};
const G_EX = { id:"EX", items:[
  lk("EX1","이 요금 결정은 나에게서 더 많은 이익을 얻어내려는 것으로 느껴진다."),
  lk("EX2","이 요금 결정은 이용자를 이용하려는 성격이 있다고 느껴진다."),
  lk("EX3","이 요금 결정은 이용자에게 불리하게 설계되어 있다고 느껴진다.")
]};
const G_PR = { id:"PR", items:[
  lk("PR1","바로콜이 나에 관한 정보를 어떻게 수집하고 있는지 걱정된다."),
  lk("PR2","바로콜이 내 정보를 어떤 목적으로 사용하는지 우려된다."),
  lk("PR3","내 정보가 어떻게 활용되는지 내가 통제하기 어렵다고 느낀다.")
]};
const G_SR = { id:"SR", items:[
  lk("SR1","이 요금은 나의 개인적인 특성이나 행동을 반영하여 정해진 것처럼 느껴졌다."),
  lk("SR2","이 요금은 나에 관한 정보에 근거해 정해진 것으로 보인다."),
  { ...lk("SR3","이 요금은 나와는 무관한 외부 상황 때문에 정해진 것으로 보인다."), reverse:true }
]};
const G_RE = { id:"RE", items:[
  lk("RE1","앞에서 읽은 상황은 실제로 일어날 법하다."),
  lk("RE2","앞에서 읽은 상황은 현실적이다."),
  lk("RE3","앞에서 읽은 상황에 몰입할 수 있었다.")
]};
const G_AN = { id:"AN", items:[
  lk("AN1","이 요금을 결정한 AI 요금 알고리즘은 사람과 비슷한 면이 있다."),
  lk("AN2","이 요금을 결정한 AI 요금 알고리즘은 스스로 생각하는 것처럼 느껴진다.")
]};
const G_GP = { id:"GP", items:[
  lk("GP1","평소 온라인 서비스가 내 개인정보를 수집하는 것에 대해 걱정하는 편이다."),
  lk("GP2","앱을 설치할 때 개인정보 관련 항목을 꼼꼼히 확인하는 편이다."),
  lk("GP3","기업이 내 정보를 어떻게 사용하는지에 대해 민감한 편이다.")
]};

/* ─────────────────────────────────────────────
   3. 상태
   ───────────────────────────────────────────── */
const R = {                       // 응답 저장소
  meta:{
    startedAt:new Date().toISOString(),
    agent:COND.agent, basis:COND.basis,
    ua:navigator.userAgent, review:REVIEW
  },
  answers:{}, timing:{}
};
let step = 0, pageEnteredAt = Date.now();

function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; }
function shuffled(group){ return { ...group, items:shuffle(group.items) }; }

// 확증적 매개변수 3묶음: 묶음 순서와 묶음 내 문항 순서를 무작위화
const MED_ORDER = shuffle(["SI","JD","UN"]);
R.meta.mediatorOrder = MED_ORDER;
const MED = { SI:G_SI, JD:G_JD, UN:G_UN };

/* ─────────────────────────────────────────────
   4. 화면 정의
   ───────────────────────────────────────────── */
const PAGES = [];

/* B0 동의 */
PAGES.push({ id:"B0", eyebrow:"안내", title:"택시 호출 앱 이용 경험 조사", render(){
  return `
  <p class="lead">안녕하세요. 본 조사는 모빌리티 플랫폼 이용 경험에 관한 학술 연구입니다.</p>
  <p>조사는 약 7~8분이 소요되며, 정답이나 오답이 없습니다. 떠오르는 대로 솔직하게 응답해 주시면 됩니다.</p>
  <p>조사 중에는 연구를 위해 구성한 모빌리티 서비스 이용 상황이 제시됩니다. 특정 기업의 실제 정책과는 무관하며, 자세한 내용은 조사가 끝난 뒤 안내해 드립니다.</p>
  <p>응답은 익명으로 처리되고 연구 목적으로만 사용되며, 원하시면 언제든 중단하실 수 있습니다.</p>
  ${choices("consent","위 내용을 확인하였으며 조사에 참여하는 데 동의하십니까?",[
    ["yes","동의합니다"],["no","동의하지 않습니다"]
  ])}`;
}, next(){ return R.answers.consent === "no" ? "STOP_CONSENT" : null; }});

function phone(notice){
  return `
  <div class="phone rv" role="img" aria-label="바로콜 앱 우선배차 화면">
    <div class="top"><div class="brand"><span>바로</span>콜</div><div class="tag">우선배차</div></div>
    <div class="body">
      <div class="fareRow"><div class="fareLabel">호출 이용료</div><div class="fare">${CONFIG.FARE_NOW}</div></div>
      <div class="prev">평소 이용료 ${CONFIG.FARE_BEFORE}</div>
      <div class="notice rv">${notice}</div>
      <div class="callBtn">호출하기</div>
    </div>
  </div>`;
}

function block(group){
  let h = "";
  if(group.lead) h += `<p class="lead">${typeof group.lead==="function"?group.lead():group.lead}</p>`;
  h += group.items.map(it => likertOne(it.code, it.text, it.lo, it.hi)).join("");
  return h;
}

function likertOne(code, text, lo, hi){
  lo = lo || L7.lo; hi = hi || L7.hi;
  const cur = R.answers[code];
  const cells = [1,2,3,4,5,6,7].map(n=>`
    <label class="${cur==n?"on":""}" data-code="${code}" data-val="${n}">
      <input type="radio" name="${code}" value="${n}" ${cur==n?"checked":""}>
      <span>${n}</span>
    </label>`).join("");
  return `<div class="q" data-req="${code}">
    <div class="stem"><div class="code">${code}</div><div class="text">${text}</div></div>
    <div class="scale" role="radiogroup" aria-label="${code}">${cells}</div>
    <div class="anchors"><span>${lo}</span><span>${hi}</span></div>
  </div>`;
}

function choices(code, text, opts){
  const cur = R.answers[code];
  const NUM = ["①","②","③","④","⑤"];
  const rows = opts.map(([v,l],i)=>`
    <label class="${cur===v?"on":""}" data-code="${code}" data-val="${v}">
      <input type="radio" name="${code}" value="${v}" ${cur===v?"checked":""}>
      <span>${NUM[i]||""} ${l}</span>
    </label>`).join("");
  return `<div class="q" data-req="${code}">
    <div class="stem"><div class="code">${code}</div><div class="text">${text}</div></div>
    <div class="choices">${rows}</div>
  </div>`;
}

/* ─────────────────────────────────────────────
   6. 진행 엔진
   ───────────────────────────────────────────── */
const app = document.getElementById("app");
const fill = document.getElementById("fill");
const pctEl = document.getElementById("pct");

function progress(){
  const p = Math.round(step / PAGES.length * 100);
  fill.style.width = p + "%"; pctEl.textContent = p + "%";
}

function draw(){
  const page = PAGES[step];
  pageEnteredAt = Date.now();
  app.innerHTML = `
    <p class="eyebrow">${page.eyebrow}</p>
    <h1>${page.title}</h1>
    ${page.render()}
    <div class="actions">
      <button class="go" id="next" ${page.sequence?"disabled":""}>${page.last?"응답 마치기":"다음"}</button>
      ${page.sequence?'<button class="ghost" id="replay" type="button" hidden>다시 보기</button>':''}
      <div class="hint" id="hint"></div>
    </div>`;
  window.scrollTo({top:0, behavior:"instant"});
  progress();

  if(page.sequence){
    runSequence();
    document.getElementById("replay").addEventListener("click", ()=>{
      R.meta.replays = (R.meta.replays||0) + 1;
      runSequence();
    });
  }
  document.getElementById("next").addEventListener("click", advance);
}

let seqTimers = [];
function runSequence(){
  seqTimers.forEach(clearTimeout); seqTimers = [];
  const nodes = [...app.querySelectorAll(".rv")];
  const btn = document.getElementById("next");
  const replay = document.getElementById("replay");
  const line = document.getElementById("pl");
  const text = document.getElementById("pt");
  const GAP = 2400, TAIL = 2800;
  const total = (nodes.length - 1) * GAP + TAIL;

  nodes.forEach(n => n.classList.remove("in"));
  btn.disabled = true; if(replay) replay.hidden = true;
  text.textContent = "보여 드리는 중";

  nodes.forEach((n,i) => seqTimers.push(setTimeout(()=>{
    n.classList.add("in");
    if(i > 0){
      const r = n.getBoundingClientRect();
      if(r.bottom > window.innerHeight - 90) n.scrollIntoView({block:"end", behavior:"smooth"});
    }
  }, i*GAP)));

  const t0 = Date.now();
  const tick = setInterval(()=>{
    const el = Date.now() - t0;
    line.style.width = Math.min(100, el/total*100) + "%";
    if(el >= total){
      clearInterval(tick);
      line.style.width = "100%";
      text.textContent = "확인 완료";
      btn.disabled = false;
      if(replay) replay.hidden = false;
    }
  }, 100);
  seqTimers.push(tick);
}

app.addEventListener("click", e=>{
  const lab = e.target.closest("label[data-code]");
  if(!lab) return;
  const code = lab.dataset.code, val = lab.dataset.val;
  R.answers[code] = isNaN(val) ? val : Number(val);
  lab.parentElement.querySelectorAll("label").forEach(l=>l.classList.remove("on"));
  lab.classList.add("on");
  const h = document.getElementById("hint"); if(h){ h.textContent=""; h.classList.remove("err"); }
});

function advance(){
  const page = PAGES[step];
  const hint = document.getElementById("hint");
  const fail = (m)=>{ hint.textContent = m; hint.classList.add("err"); };

  if(page.validate){
    const msg = page.validate();
    if(msg) return fail(msg);
  }
  const missing = [...app.querySelectorAll("[data-req]")].filter(q => R.answers[q.dataset.req] === undefined);
  if(missing.length){
    missing[0].scrollIntoView({block:"center", behavior:"smooth"});
    return fail(`응답하지 않은 문항이 ${missing.length}개 있습니다.`);
  }

  R.timing[page.id] = Date.now() - pageEnteredAt;

  const jump = page.next && page.next();
  if(jump === "STOP_CONSENT") return end("동의하지 않으셨습니다", "조사를 종료합니다. 참여를 고려해 주셔서 감사합니다.", false);
  if(jump === "STOP_SCREEN")  return end("조사 대상에 해당하지 않습니다", "이번 조사는 최근 6개월 이내에 택시 호출 앱을 이용하신 만 20~59세 성인을 대상으로 합니다. 참여해 주셔서 감사합니다.", false);

  if(page.last) return finish();
  step++; draw();
}

function end(title, body, done){
  fill.style.width = "100%"; pctEl.textContent = "100%";
  app.innerHTML = `<p class="eyebrow">종료</p><h1>${title}</h1><p class="lead">${body}</p>`;
  window.onbeforeunload = null;
  window.scrollTo({top:0});
}

function finish(){
  R.meta.finishedAt = new Date().toISOString();
  R.meta.durationSec = Math.round((Date.parse(R.meta.finishedAt) - Date.parse(R.meta.startedAt))/1000);
  const payload = JSON.stringify(R);

  let sent = false;
  if(CONFIG.ENDPOINT){
    try{
      fetch(CONFIG.ENDPOINT, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"}, body:payload});
      sent = true;
    }catch(e){ sent = false; }
  }

  fill.style.width = "100%"; pctEl.textContent = "100%";
  window.onbeforeunload = null;
  app.innerHTML = `
    <p class="eyebrow">종료</p>
    <h1>조사에 참여해 주셔서 감사합니다</h1>
    <div class="card">
      <p><strong>안내드립니다.</strong> 본 조사에서 제시된 “바로콜”은 연구를 위해 만들어진 가상의 앱이며 실제로 존재하지 않습니다. 화면에 제시된 호출 이용료와 요금 산정 방식 역시 연구용으로 구성한 가상의 상황으로, 실제 택시 호출 서비스가 이러한 방식으로 요금을 정하고 있다는 뜻이 아닙니다.</p>
      <p>이 연구는 요금이 인상되었다는 안내를 받았을 때, 그 요금을 <strong>누가</strong> 정했는지와 <strong>무엇을 바탕으로</strong> 정했는지에 따라 소비자가 요금을 어떻게 받아들이는지를 알아보기 위한 것입니다. 참가자마다 조금씩 다른 안내 문구를 보셨습니다.</p>
      <p class="fine">문의: 국민대학교 비즈니스IT전문대학원 이승현</p>
    </div>
    ${sent ? `<p class="fine">응답이 정상적으로 저장되었습니다.</p>`
           : `<h2>응답 저장</h2>
              <p class="fine">아래 버튼을 눌러 응답 파일을 저장한 뒤 연구자에게 전달해 주세요. 조사 도구를 정식 운영할 때는 서버로 자동 전송되도록 설정합니다.</p>
              <div class="actions"><button class="go" id="dl">응답 파일 내려받기</button></div>
              <h2 class="fine" style="margin-top:2rem">응답 내용</h2>
              <code class="out">${payload.replace(/[<>&]/g, c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))}</code>`}
  `;
  const dl = document.getElementById("dl");
  if(dl) dl.addEventListener("click", ()=>{
    const blob = new Blob([payload], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `barocall_${COND.agent}_${COND.basis}_${Date.now()}.json`;
    a.click();
  });
  window.scrollTo({top:0});
}

    toggle.setAttribute("aria-expanded", String(!box.hidden));
    toggle.textContent = box.hidden ? "조건 전환" : "닫기";
  });
  document.body.append(box, toggle);
  document.getElementById("rvAgent").value = COND.agent;
  document.getElementById("rvBasis").value = COND.basis;
  document.getElementById("rvGo").addEventListener("click", ()=>{
    const a = document.getElementById("rvAgent").value;
    const b = document.getElementById("rvBasis").value;
    location.search = `?review=1&agent=${a}&basis=${b}`;
  });
}

/* 실수로 새로고침하는 것 방지 */
window.onbeforeunload = () => "";

draw();
</script>
</body>
</html>
